services:
  - type: web
    name: marrakechdunes-backend
    runtime: docker
    plan: starter
    scaling:
      minInstances: 1
      maxInstances: 5
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    port: 10000
    # Build timeout
    buildTimeoutSeconds: 1800
    # Environment variables
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DOCKER_BUILDKIT
        value: "0"
      - key: BUILDKIT_PROGRESS
        value: plain
      # CLIENT_URL / CORS_ALLOWED_ORIGINS (M12/H1): no owner-specific domain
      # is committed here. Set at least one of these in the Render dashboard
      # to your actual Public/Admin frontend origin(s) before deploying -
      # the server fails closed (refuses to start in production) without
      # one, rather than silently falling back to someone else's domain.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: MAP_PROVIDER
        value: iframe
      - key: LEAFLET_ENABLED
        value: false
      # H2: explicit - do not run destructive legacy startup seeding.
      - key: LEGACY_STARTUP_SEEDING
        value: "false"
      # M12: owner-identifying links shown to customers/admins. Unset by
      # default (messages omit the link/number) until the deploying owner
      # fills these in.
      - key: PUBLIC_SITE_URL
        sync: false
      - key: ADMIN_SITE_URL
        sync: false
      - key: SUPPORT_PHONE
        sync: false
      # Sensitive variables (set in Render dashboard)
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: WHATSAPP_RECEIVERS
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GYG_SUPPLIER_USER
        sync: false
      - key: GYG_SUPPLIER_PASS
        sync: false