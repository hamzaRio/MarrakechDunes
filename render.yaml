services:
  - type: web
    name: marrakech-dunes-backend
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        value: https://marrakech-dunes.vercel.app,http://localhost:5173
      - key: COOKIE_DOMAIN
        value: .onrender.com
      - key: WHATSAPP_RECEIVERS
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: PORT
        value: 5000
    disk:
      name: marrakech-assets
      mountPath: /app/attached_assets
      sizeGB: 1
    autoDeploy: true