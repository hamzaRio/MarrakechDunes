services:
  - type: web
    name: marrakechdunes-backend
    runtime: docker
    plan: starter
    scaling:
      minInstances: 1
      maxInstances: 5
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    port: 10000
    # Build timeout
    buildTimeoutSeconds: 1800
    # Environment variables
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DOCKER_BUILDKIT
        value: "0"
      - key: BUILDKIT_PROGRESS
        value: plain
      - key: CLIENT_URL
        value: https://marrakech-dunes.vercel.app,https://marrakech-dunes-*.vercel.app,http://localhost:5173
      - key: MAP_PROVIDER
        value: iframe
      - key: LEAFLET_ENABLED
        value: false
      # Sensitive variables (set in Render dashboard)
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: WHATSAPP_RECEIVERS
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GYG_SUPPLIER_USER
        sync: false
      - key: GYG_SUPPLIER_PASS
        sync: false