<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MarrakechDunes - Authentic Moroccan Adventures</title>
    <meta name="description" content="Book unforgettable authentic Moroccan adventures and desert experiences. Discover the magic of Morocco with MarrakechDunes." />
    <meta name="keywords" content="Morocco, Marrakech, desert, adventures, tours, authentic experiences, Atlas Mountains, Sahara" />
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    
    <!-- Content Security Policy -->
    <!-- __CSP_CONNECT_SRC__ / __OG_URL__ / __OG_IMAGE__ are replaced at build
         time from VITE_API_URL / VITE_SITE_URL by the vite-html-config
         plugin (vite.config.ts) — see docs/handoff-runbook.md. No source
         edit is needed to point a new deployment at a different domain. -->
    <!-- Note: ERR_BLOCKED_BY_CLIENT errors are usually from browser extensions, not CSP -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' https://maps.googleapis.com https://*.googleapis.com https://vercel.live; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://maps.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob: https://maps.gstatic.com https://maps.google.com https://*.google.com https://*.googleapis.com https://www.openstreetmap.org https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://images.unsplash.com https://*.unsplash.com; connect-src 'self' __CSP_CONNECT_SRC__ https://api.whatsapp.com https://maps.googleapis.com https://*.googleapis.com https://*.gstatic.com; frame-src 'self' https://www.openstreetmap.org https://www.google.com https://maps.google.com https://*.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="__OG_URL__" />
    <meta property="og:title" content="MarrakechDunes - Authentic Moroccan Adventures" />
    <meta property="og:description" content="Book unforgettable authentic Moroccan adventures and desert experiences." />
    <meta property="og:image" content="__OG_IMAGE__" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="__OG_URL__" />
    <meta property="twitter:title" content="MarrakechDunes - Authentic Moroccan Adventures" />
    <meta property="twitter:description" content="Book unforgettable authentic Moroccan adventures and desert experiences." />
    <meta property="twitter:image" content="__OG_IMAGE__" />
  </head>
  <body>
    <div id="root"></div>
    <script src="/config.js"></script>
    <script type="module" src="/src/main-public.tsx"></script>
  </body>
</html>
