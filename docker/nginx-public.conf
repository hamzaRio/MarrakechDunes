server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  location = /healthz { include /etc/nginx/security-headers.conf; default_type text/plain; add_header Cache-Control "no-store"; return 200 'ok\n'; }
  location = /config.js { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-store, no-cache, must-revalidate" always; try_files $uri =404; }
  location = /index.html { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-store, no-cache, must-revalidate" always; try_files $uri =404; }
  location = /sw.js { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache, no-store, must-revalidate" always; try_files $uri =404; }
  location = /manifest.webmanifest { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache, no-store, must-revalidate" always; try_files $uri =404; }
  location = /registerSW.js { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache, no-store, must-revalidate" always; try_files $uri =404; }
  location = /pwa-cache-cleanup.js { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache, no-store, must-revalidate" always; try_files $uri =404; }
  location ~* ^/assets/ { include /etc/nginx/security-headers.conf; add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }
  location / { include /etc/nginx/security-headers.conf; try_files $uri $uri/ /index.html; }
}