name: marrakechdunes

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand({ ping: 1 }).ok\" | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 10000
      ROLE: all
      DATABASE_URL: mongodb://mongo:27017/${MONGO_DB_NAME:-marrakechdunes}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      LEGACY_STARTUP_SEEDING: "false"
      SEED_DEMO_DATA: "false"
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:8081}
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      TRUST_PROXY: "0"
    ports:
      - "${API_PORT:-10000}:10000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:'+(process.env.PORT||10000)+'/api/health/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  web-public:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        APP: public
    restart: unless-stopped
    environment:
      API_URL: ${PUBLIC_API_URL:-http://localhost:10000/api}
    ports:
      - "${PUBLIC_WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

  web-admin:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        APP: admin
    restart: unless-stopped
    environment:
      API_URL: ${ADMIN_API_URL:-http://localhost:10000/api}
    ports:
      - "${ADMIN_WEB_PORT:-8081}:8080"
    depends_on:
      api:
        condition: service_healthy

  bootstrap:
    profiles: ["bootstrap"]
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      NODE_ENV: development
      ROLE: all
      DATABASE_URL: mongodb://mongo:27017/${MONGO_DB_NAME:-marrakechdunes}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      LEGACY_STARTUP_SEEDING: "false"
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:?BOOTSTRAP_ADMIN_USERNAME is required}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD is required}
    command: ["node", "dist/bootstrap/cli.js"]
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
