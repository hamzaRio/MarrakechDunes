name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - run: npx tsc -p server/tsconfig.json --noEmit
      - run: npx tsc -p client/tsconfig.json --noEmit --noUnusedLocals false --noUnusedParameters false

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  browser-and-mongo-hardening:
    name: Browser and Mongo hardening
    runs-on: ubuntu-latest
    env:
      MONGOMS_DISABLE_POSTINSTALL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:public
        env:
          VITE_API_URL: http://127.0.0.1:18080/api
          VITE_SITE_URL: https://example.com
      - run: npm run build:admin
        env:
          VITE_API_URL: http://127.0.0.1:18080/api
      - run: REQUIRE_BROWSER_API=1 npm run test:browser-hardening
      - run: npm run build:server && npx tsx server/src/scripts/capacity-concurrency-harness.ts
      - name: Download pinned MongoDB Database Tools
        run: |
          curl -fsSL https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2404-x86_64-100.12.2.tgz -o /tmp/mongodb-tools.tgz
          mkdir -p /tmp/mongodb-tools
          tar -xzf /tmp/mongodb-tools.tgz --strip-components=1 -C /tmp/mongodb-tools
      - name: Backup and restore hardening
        env:
          MONGODB_DATABASE_TOOLS_DIR: /tmp/mongodb-tools/bin
        run: npm run test:backup-restore
      - name: Application hardening harnesses
        run: |
          npx tsx scripts/cors-harness.ts
          npx tsx scripts/booking-lifecycle-override-harness.ts
          npx tsx scripts/superadmin-password-harness.ts
          npx tsx scripts/public-admin-auth-boundary-harness.ts
          npx tsx scripts/pwa-security-harness.ts
