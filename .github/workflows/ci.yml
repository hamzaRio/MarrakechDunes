name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  # mongodb-memory-server downloads are installed explicitly by the
  # integration job; dependency installation must remain network-bounded.
  MONGOMS_DISABLE_POSTINSTALL: '1'

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - run: npx tsc -p server/tsconfig.json --noEmit
      - run: npx tsc -p client/tsconfig.json --noEmit --noUnusedLocals false --noUnusedParameters false

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  browser-and-mongo-hardening:
    name: Browser and Mongo hardening
    runs-on: ubuntu-latest
    env:
      MONGOMS_DISABLE_POSTINSTALL: '1'
      MONGOMS_VERSION: '7.0.14'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:public
        env:
          VITE_API_URL: http://127.0.0.1:18080/api
          VITE_SITE_URL: https://example.com
      - run: npm run build:admin
        env:
          VITE_API_URL: http://127.0.0.1:18080/api
      - run: REQUIRE_BROWSER_API=1 npm run test:browser-hardening
      - run: npm run build:server
      - run: npx tsx server/src/scripts/capacity-concurrency-harness.ts
      - run: npx tsx server/src/scripts/capacity-legacy-lifecycle-harness.ts
      - run: npx tsx server/src/scripts/capacity-override-rollback-harness.ts
      - run: npm run test:admin-financial-market
      - run: npm run test:booking-history
      - run: npm run test:phase1-reservation
      - run: npm run test:non-storage-integration
      - run: npm run test:transaction-capability
      - name: Download pinned MongoDB Database Tools
        run: |
          curl -fsSL https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2404-x86_64-100.12.2.tgz -o /tmp/mongodb-tools.tgz
          mkdir -p /tmp/mongodb-tools
          tar -xzf /tmp/mongodb-tools.tgz --strip-components=1 -C /tmp/mongodb-tools
      - name: Backup and restore hardening
        env:
          MONGODB_DATABASE_TOOLS_DIR: /tmp/mongodb-tools/bin
        run: npm run test:backup-restore
      - name: Application hardening harnesses
        run: |
          npx tsx scripts/cors-harness.ts
          npx tsx scripts/booking-lifecycle-override-harness.ts
          npx tsx scripts/superadmin-password-harness.ts
          npx tsx scripts/public-admin-auth-boundary-harness.ts
          npx tsx scripts/pwa-security-harness.ts
          npx tsx scripts/email-escaping-harness.ts
          npx tsx scripts/log-privacy-harness.ts
          node scripts/owner-deidentification-harness.mjs
          npx tsx scripts/config-portability-harness.ts
          npx tsx scripts/frontend-build-separation-harness.ts

  phase1-acceptance:
    name: Phase 1 acceptance (isolated)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      ROLE: all
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:4173,http://127.0.0.1:4174
      DATABASE_URL: mongodb://127.0.0.1:27017/phase1_ci
      SESSION_SECRET: phase1-ci-session-secret-only
      JWT_SECRET: phase1-ci-jwt-secret-only
      MONGOMS_DISABLE_POSTINSTALL: '1'
      REQUIRE_BROWSER_API: '1'
      MONGOMS_VERSION: '7.0.14'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run build:public
        env:
          VITE_API_URL: http://127.0.0.1:18080/api
          VITE_SITE_URL: http://127.0.0.1:4173
      - run: npm run build:admin
        env:
          VITE_API_URL: http://127.0.0.1:18080/api
      - run: npm run test:phase1-launcher
      - run: npm run test:phase1-reservation
      - run: npm run test:browser-hardening
      - run: npm run test:non-storage-integration
